<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Background Gradient Matching Portfolio Theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#081528" />
      <stop offset="85%" stop-color="#0b2447" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1584" height="396" fill="url(#bgGradient)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="260" fill="url(#orbCyan)" />
  <circle cx="1380" cy="300" r="320" fill="url(#orbBlue)" />
  <circle cx="850" cy="40" r="200" fill="url(#orbCyan)" />

  <!-- Decorative Tech Geometric Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="396" />
    <line x1="280" y1="0" x2="280" y2="396" />
    <line x1="1280" y1="0" x2="1280" y2="396" />
    <line x1="1480" y1="0" x2="1480" y2="396" />
    <line x1="0" y1="80" x2="1584" y2="80" />
    <line x1="0" y1="320" x2="1584" y2="320" />
  </g>

  <!-- Left Side Space Reserved for LinkedIn Profile Avatar (Circular Safe Zone visual cue) -->
  <!-- Main Content Shifted to Right (x: 420 to 1500) for Perfect LinkedIn Desktop & Mobile Layout -->

  <!-- Top Badge: Status / Availability -->
  <g transform="translate(430, 52)">
    <rect width="320" height="32" rx="16" fill="url(#badgeBg)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="16" r="4.5" fill="#10b981" />
    <circle cx="16" cy="16" r="8" fill="#10b981" opacity="0.3" />
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      OPEN TO INTERNSHIPS &amp; ROLES
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="430" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">
    Kashish Kumari
  </text>

  <!-- Accent Underline Bar -->
  <rect x="430" y="162" width="220" height="5" rx="2.5" fill="url(#accentGradient)" filter="url(#glow)" />

  <!-- Dynamic Roles Subtitle -->
  <text x="430" y="205" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Python Developer  •  Generative AI Builder  •  Data Analyst  •  Graphic Designer
  </text>

  <!-- One-liner Bio / Impact Statement -->
  <text x="430" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    BS IT @ GCUH (CGPA 3.80/4.0) | LangChain &amp; RAG Systems | Python Automation | Data Visualization
  </text>

  <!-- Feature Skill Badges -->
  <g transform="translate(430, 268)">
    <!-- Badge 1: Python -->
    <g transform="translate(0, 0)">
      <rect width="90" height="34" rx="17" fill="url(#badgeBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="45" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Python</text>
    </g>

    <!-- Badge 2: GenAI & LangChain -->
    <g transform="translate(102, 0)">
      <rect width="168" height="34" rx="17" fill="url(#badgeBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="84" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GenAI &amp; LangChain</text>
    </g>

    <!-- Badge 3: Streamlit & Pandas -->
    <g transform="translate(282, 0)">
      <rect width="158" height="34" rx="17" fill="url(#badgeBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="79" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Streamlit &amp; Pandas</text>
    </g>

    <!-- Badge 4: UI/UX & Photoshop -->
    <g transform="translate(452, 0)">
      <rect width="158" height="34" rx="17" fill="url(#badgeBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="79" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Graphic &amp; UI Design</text>
    </g>

    <!-- Badge 5: Fast Inferences -->
    <g transform="translate(622, 0)">
      <rect width="118" height="34" rx="17" fill="url(#badgeBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <text x="59" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Groq LLMs</text>
    </g>
  </g>

  <!-- Bottom Details Contact & Portfolio Callout -->
  <g transform="translate(430, 342)">
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
      🌐 kashishkumari.netlify.app
    </text>
    <text x="240" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">|</text>
    <text x="260" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
      ✉️ kashish06kumari@gmail.com
    </text>
    <text x="530" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">|</text>
    <text x="550" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">
      📍 Hyderabad, Sindh, Pakistan
    </text>
  </g>

  <!-- Right Decorative Element: Abstract Glowing Code / Geometry -->
  <g transform="translate(1330, 70)" opacity="0.75">
    <rect width="160" height="110" rx="16" fill="url(#badgeBg)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="28" cy="28" r="4" fill="#ef4444" />
    <circle cx="42" cy="28" r="4" fill="#f59e0b" />
    <circle cx="56" cy="28" r="4" fill="#10b981" />
    <text x="26" y="60" fill="#38bdf8" font-family="monospace" font-size="12 font-weight='700'">import langchain</text>
    <text x="26" y="80" fill="#a5f3fc" font-family="monospace" font-size="12 font-weight='700'">model = Groq()</text>
    <text x="26" y="100" fill="#34d399" font-family="monospace" font-size="11 font-weight='600'">build_ai_rag()</text>
  </g>
</svg>