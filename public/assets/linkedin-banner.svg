<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Smooth Deep Tech Background matching Portfolio -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120" />
      <stop offset="50%" stop-color="#0d1b2e" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Cyan-to-Blue Highlight Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Subtle Glass Pill Background -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Ambient Glow Drops -->
    <radialGradient id="glowLeft" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1584" height="396" fill="url(#bg)" />

  <!-- Soft Volumetric Background Glows -->
  <circle cx="260" cy="120" r="340" fill="url(#glowLeft)" />
  <circle cx="1320" cy="220" r="380" fill="url(#glowRight)" />

  <!-- Very Subtle Clean Tech Grid (Minimal) -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="99" x2="1584" y2="99" />
    <line x1="0" y1="198" x2="1584" y2="198" />
    <line x1="0" y1="297" x2="1584" y2="297" />
    <line x1="396" y1="0" x2="396" y2="396" />
    <line x1="792" y1="0" x2="792" y2="396" />
    <line x1="1188" y1="0" x2="1188" y2="396" />
  </g>

  <!-- ======================================================== -->
  <!-- MAIN CONTENT: Safe Zone (Left: 380px reserved for Avatar) -->
  <!-- ======================================================== -->

  <!-- Status Chip: Open to Opportunities -->
  <g transform="translate(400, 56)">
    <rect width="250" height="30" rx="15" fill="url(#pillBg)" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.35" />
    <circle cx="15" cy="15" r="4" fill="#34d399" />
    <circle cx="15" cy="15" r="8" fill="#34d399" opacity="0.25" />
    <text x="30" y="20" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2">
      OPEN TO WORK &amp; COLLABORATION
    </text>
  </g>

  <!-- Name -->
  <text x="400" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">
    Kashish Kumari
  </text>

  <!-- Accent underline bar matching portfolio hero -->
  <rect x="400" y="156" width="130" height="4.5" rx="2.25" fill="url(#cyanBlue)" />

  <!-- Roles Title: Clean, highlighted -->
  <text x="400" y="196" fill="url(#cyanBlue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.3">
    Python Developer  •  Data Analyst  •  GenAI Builder  •  Graphic Designer
  </text>

  <!-- Concise Tagline / Bio -->
  <text x="400" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    BS IT @ GCUH (CGPA 3.80) | Building Intelligent AI Automations, Data Solutions &amp; Modern Designs
  </text>

  <!-- Core Skills Pills: Minimal, elegant, spaced -->
  <g transform="translate(400, 258)">
    <!-- Pill 1: Python -->
    <g transform="translate(0, 0)">
      <rect width="84" height="32" rx="16" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="42" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Python</text>
    </g>

    <!-- Pill 2: FastAPI -->
    <g transform="translate(94, 0)">
      <rect width="86" height="32" rx="16" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="43" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">FastAPI</text>
    </g>

    <!-- Pill 3: Pandas & EDA -->
    <g transform="translate(190, 0)">
      <rect width="130" height="32" rx="16" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="65" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Pandas &amp; EDA</text>
    </g>

    <!-- Pill 4: Scikit-Learn -->
    <g transform="translate(330, 0)">
      <rect width="118" height="32" rx="16" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="59" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Scikit-Learn</text>
    </g>

    <!-- Pill 5: GenAI & RAG -->
    <g transform="translate(458, 0)">
      <rect width="122" height="32" rx="16" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="61" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">GenAI &amp; RAG</text>
    </g>

    <!-- Pill 6: Graphic Design -->
    <g transform="translate(590, 0)">
      <rect width="130" height="32" rx="16" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
      <text x="65" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Graphic Design</text>
    </g>
  </g>

  <!-- Clean Contact & Portfolio Footer Line -->
  <g transform="translate(400, 334)">
    <!-- Portfolio -->
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      kashishkumari.netlify.app
    </text>

    <!-- Separator -->
    <text x="210" y="0" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">•</text>

    <!-- Email -->
    <text x="230" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      kashish06kumari@gmail.com
    </text>

    <!-- Separator -->
    <text x="475" y="0" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">•</text>

    <!-- Location -->
    <text x="495" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Hyderabad, Pakistan
    </text>
  </g>

  <!-- Right Side: Clean Minimal Tech Accents -->
  <g transform="translate(1360, 100)" opacity="0.6">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="60" cy="60" r="30" fill="none" stroke="#3b82f6" stroke-width="1" />
    <circle cx="60" cy="60" r="4" fill="#38bdf8" />
  </g>
</svg>
